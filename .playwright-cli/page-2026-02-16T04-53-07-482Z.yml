            - heading "How to Run a Specific Spec File in Playwright Tests Sequentially" [level=1] [ref=e37]
            - generic [ref=e39]:
              - list [ref=e40]:
                - listitem [ref=e41]:
                  - link "Butch Mayhew" [ref=e42] [cursor=pointer]:
                    - /url: /author/butch/
