                    - text: 4 min read
          - generic [ref=e51]:
            - paragraph [ref=e52]: If you've ever been in a scenario where a test you were writing changed the state of the system or user in a way where other tests would fail? This solution may help you. While I am a big fan of running my tests at the same time in parallel there times where this may not be feasible. This is typically when you have a state that needs to be consistent.
            - heading "Scenario" [level=2] [ref=e53]
            - paragraph [ref=e54]:
              - text: We'll use the repo linked below and use the
              - code [ref=e55]: account.spec.ts
              - text: to demonstrate the functionality.
            - figure [ref=e56]:
              - 'link "GitHub - playwrightsolutions/playwright-practicesoftwaretesting.com: Example using Playwright against site https://practicesoftwaretesting.com Example using Playwright against site https://practicesoftwaretesting.com - playwrightsolutions/playwright-practicesoftwaretesting.com GitHub •playwrightsolutions" [ref=e57] [cursor=pointer]':
                - /url: https://github.com/playwrightsolutions/playwright-practicesoftwaretesting.com?ref=playwrightsolutions.com
                - generic [ref=e58]:
                  - generic [ref=e59]: "GitHub - playwrightsolutions/playwright-practicesoftwaretesting.com: Example using Playwright against site https://practicesoftwaretesting.com"
                  - generic [ref=e60]: Example using Playwright against site https://practicesoftwaretesting.com - playwrightsolutions/playwright-practicesoftwaretesting.com
                  - generic [ref=e61]:
                    - generic [ref=e62]: GitHub
                    - generic [ref=e63]: •playwrightsolutions
            - paragraph [ref=e65]: The code we will run is listed below. Notice the below there are 3 tests.
            - list [ref=e66]:
              - listitem [ref=e67]: In the first test we don't make any changes to any data we only make assertions.
              - listitem [ref=e68]: In the second test we make a change to the first name, last name, and street 1 address.
              - listitem [ref=e69]: In the third test we don't make any changes to any data only make an assertion.
            - paragraph [ref=e70]: The problem here is that the 2nd test changes data that test 1 and test 3 rely on "Jane Doe" first and last name.
            - code [ref=e72]:
              - text: "//tests/account/account.spec.ts import { test, expect } from \"@playwright/test\"; test.describe(\"Customer 01 my account specs\", () => { test.use({ storageState: \".auth/customer01.json\" }); test.afterEach(async ("
              - generic [ref=e73]: "{ page }"
              - text: ") => { await page.goto(\"/account/profile\"); await page.waitForLoadState(\"networkidle\"); await page.getByTestId(\"first-name\").fill(\"Jane\"); await page.getByTestId(\"last-name\").fill(\"Doe\"); await page.getByTestId(\"address\").fill(\"101 Testing Way\"); await page.getByTestId(\"update-profile-submit\").click(); await expect( page.getByRole(\"alert\").filter({ hasText: \"successfully\" }) ).toBeVisible(); }); test(\"validate customer 01 my account page\", async ("
              - generic [ref=e74]: "{ page }"
              - text: ") => { await page.goto(\"/account\"); expect(await page.getByTestId(\"nav-menu\").innerText()).toContain( \"Jane Doe\" ); expect(await page.getByTestId(\"page-title\").innerText()).toContain( \"My account\" ); expect(await page.getByTestId(\"nav-favorites\").innerText()).toContain( \"Favorites\" ); }); test(\"update customer 01 account\", async ("
              - generic [ref=e75]: "{ page }"
              - text: ") => { await page.goto(\"account/profile\"); await page.waitForLoadState(\"networkidle\"); await page.getByTestId(\"first-name\").fill(\"Testy\"); await page.getByTestId(\"last-name\").fill(\"McTesterface\"); await page.getByTestId(\"address\").fill(\"101 Testing Way\"); await page.getByTestId(\"update-profile-submit\").click(); await expect( page.getByRole(\"alert\").filter({ hasText: \"successfully\" }) ).toBeVisible(); // Assert the updated name is displayed in the nav menu await page.reload(); expect(await page.getByTestId(\"nav-menu\").innerText()).toContain( \"Testy McTesterface\" ); await expect(page.getByTestId(\"first-name\")).toHaveValue(\"Testy\"); await expect(page.getByTestId(\"last-name\")).toHaveValue(\"McTesterface\"); await expect(page.getByTestId(\"address\")).toHaveValue(\"101 Testing Way\"); }); test(\"validate customer 01 account other\", async ("
              - generic [ref=e76]: "{ page }"
              - text: ") => { await page.goto(\"/account\"); expect(await page.getByTestId(\"nav-menu\").innerText()).toContain( \"Jane Doe\" ); }); });"
            - heading "Running the tests without options" [level=2] [ref=e77]
            - code [ref=e79]: npx playwright test tests/account/account.spec.ts
            - paragraph [ref=e80]:
              - text: When running my tests with my default
              - code [ref=e81]: playwright.config.ts
              - text: ", the test ran with 3 workers 1 test for each, and all tests ran at the same time."
            - paragraph [ref=e82]:
              - text: When running the tests you can see that the first test failed, and the 2nd test passed. This is because the afterEach block will actually reset the data for every test. I could make this where it only runs the afterEach based on the title see
              - link "A Better Way to Control Before and After Blocks with Test Titles" [ref=e83] [cursor=pointer]:
                - /url: https://playwrightsolutions.com/a-better-way-to-control-before-and-after-blocks-with-test-titles-in-playwright-test/
              - text: article.
            - figure [ref=e84]
            - paragraph [ref=e85]:
              - text: Now I could go to my
              - code [ref=e86]: playwright.config.ts
              - text: file and update the amount of workers that should run and set to
              - code [ref=e87]: "1"
              - text: ", or change fullyParallel option to"
              - code [ref=e88]: "false"
              - text: but this would increase the full time of all of my tests running.
            - paragraph [ref=e89]: The good news is there is another option, to limit the way our tests run from within a test.describe() block.
            - heading "Running the tests with \"default\" configuration option" [level=2] [ref=e90]
            - paragraph [ref=e91]:
              - text: To configure this add the line
              - code [ref=e92]: "test.describe.configure({ mode: \"default\" });"
              - text: within your describe block. The
              - link "docs" [ref=e93] [cursor=pointer]:
                - /url: https://playwright.dev/docs/api/class-test?ref=playwrightsolutions.com#test-describe-configure
              - text: for this walk through the different options.
            - code [ref=e95]: "//tests/account/account.spec.ts import { test, expect } from \"@playwright/test\"; test.describe(\"Customer 01 my account specs\", () => { test.describe.configure({ mode: \"default\" }); ..."
            - paragraph [ref=e96]: This default option will allow tests to run one at a time in order within the describe block of a spec file. This allows you to override the default configuration for the rest of your test suite for a specific set of tests.
            - figure [ref=e97]
            - paragraph [ref=e98]: With this in place your tests are all passing again, and I still get the benefit of having the rest of my automation suite running in parallel.
            - paragraph [ref=e99]:
              - text: There is another option for achieving the same result it is setting the
              - code [ref=e100]: "test.describe.configure({ mode: \"serial\" });"
              - text: The difference with using serial is if any of the tests fail while running in serial mode, the following tests that are apart of the describe block will be
              - code [ref=e101]: skipped
              - text: . This could be useful if you have tests that build data for other tests, but that is a practice I would not recommend. Each test should create and cleanup it's own test data.
            - heading "Big Thanks" [level=2] [ref=e102]
            - paragraph [ref=e103]:
              - text: One thing to note is the option
              - code [ref=e104]: default
              - text: must be specified in the test if you want to use it, which is a bit counter intuitive as
              - link "Stefan Judis" [ref=e105] [cursor=pointer]:
                - /url: https://www.linkedin.com/in/stefan-judis/?ref=playwrightsolutions.com
              - text: in a recent
