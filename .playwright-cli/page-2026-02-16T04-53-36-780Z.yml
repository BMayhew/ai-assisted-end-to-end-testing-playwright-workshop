            - heading "How Do You Scroll To The Bottom Of An Infinite Scrolling Page In A Playwright Test?" [level=1] [ref=e37]
            - generic [ref=e39]:
              - list [ref=e40]:
                - listitem [ref=e41]:
                  - link "Butch Mayhew" [ref=e42] [cursor=pointer]:
                    - /url: /author/butch/
                    - img "Butch Mayhew" [ref=e43]
              - generic [ref=e44]:
                - heading "Butch Mayhew" [level=4] [ref=e45]:
                  - link "Butch Mayhew" [ref=e46] [cursor=pointer]:
                    - /url: /author/butch/
                - generic [ref=e47]:
                  - time [ref=e48]: Aug 12, 2024
                  - generic [ref=e49]:
                    - generic [ref=e50]: •
                    - text: 2 min read
          - generic [ref=e51]:
            - paragraph [ref=e52]: This week our team had a renewed focus on addressing some of our flakey tests, and one of the things we ran across was an interesting page interaction.
            - paragraph [ref=e53]: We wanted to utilize our drop down to limit the amount of responses within a page. The options for filtering are 5, 10, 25, and 50. The drop down is at the bottom of the page, and we had some flakey tests where 1 in every 5 test runs, the screen would get in a state where the drop down is clicked and partially viewable but not scrolled down to the element to interact with it. See the video below.
            - figure [ref=e54]:
              - generic [ref=e55]:
                - button [ref=e58] [cursor=pointer]:
                  - img [ref=e59]
                - generic [ref=e62]:
                  - button [ref=e63] [cursor=pointer]:
                    - img [ref=e64]
                  - generic [ref=e66]: 0:00
                  - generic [ref=e67]: /0:33
                  - slider [ref=e68]: "0"
                  - button "1×" [ref=e69] [cursor=pointer]
                  - button [ref=e70] [cursor=pointer]:
                    - img [ref=e71]
                  - slider [ref=e73]: "100"
            - paragraph [ref=e74]: The logs from the html report show where it attempted to scroll down but because the way the element is built, I guess it couldn't.
            - code [ref=e76]: "// html report error message TimeoutError: locator.click: Timeout 10000ms exceeded. =========================== logs =========================== waiting for getByRole('option', { name: '25', exact: true }) locator resolved to <mat-option role=\"option\" id=\"mat-option-3\" aria-selected=\"f…>…</mat-option> attempting click action waiting for element to be visible, enabled and stable element is not stable - waiting... element is visible, enabled and stable scrolling into view if needed done scrolling element is outside of the viewport retrying click action, attempt #1 waiting for element to be visible, enabled and stable element is visible, enabled and stable scrolling into view if needed done scrolling element is outside of the viewport ... // 22 more attempts were made before hitting the timeout threshold"
            - heading "Set click() to force true" [level=2] [ref=e77]
            - paragraph [ref=e78]:
              - text: As I thought about how to solve this problem, 2 ways came to mind. The first being just set
              - code [ref=e79]: force:true
              - text: on the
              - link "click action" [ref=e80] [cursor=pointer]:
                - /url: https://playwright.dev/docs/input?ref=playwrightsolutions.com#forcing-the-click
              - text: . This can be seen below. This is a good solution but I wanted to have the page scrolled like a user would rather than automagically clicking the button. Also note that I am using
              - code [ref=e81]: this.page
              - text: syntax as I am running this code from a Class ( my page object).
            - code [ref=e83]: "// sharedPage.ts (page object) async selectItemsPerPage(howManyItems) { await this.itemsPerPage.locator(\".mat-mdc-select-trigger\").click(); await this.page .getByRole(\"option\", { name: howManyItems, exact: true }) .click({ force: true }); }"
            - heading "Scroll to the bottom of the page" [level=2] [ref=e84]
            - paragraph [ref=e85]:
              - text: So I started looking at how to implement ways to scroll to the bottom of the page. I started by actually trying to just use the
              - link ".scrollIntoViewIfNeeded()" [ref=e86] [cursor=pointer]:
                - /url: https://playwright.dev/docs/api/class-locator?ref=playwrightsolutions.com#locator-scroll-into-view-if-needed
              - text: function playwright, but I guess the browser thought the element was already in view much like the html report error logs showed it attempted to scroll into view.
            - paragraph [ref=e87]: My work around was to use page.evaluate, grab the document.body.scrollHeight and use window.scrollTo() the value. This function will also take into account any lazy loading pages that may grow as you scroll, this was not a concern of mine but the code will handle it, though you may need to adjust the delay.
            - code [ref=e89]: "// sharedPage.ts (page object) async selectItemsPerPage(howManyItems) { await this.itemsPerPage.locator(\".mat-mdc-select-trigger\").click(); // Scroll to the bottom of the page await this.page.evaluate(async () => { const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms)); for (let i = 0; i < document.body.scrollHeight; i += 100) { window.scrollTo(0, i); await delay(100); } }); await this.page .getByRole(\"option\", { name: howManyItems, exact: true }) .click(; }"
            - paragraph [ref=e90]:
              - text: The above code was listed as a part of a solution to a
              - link "GitHub question" [ref=e91] [cursor=pointer]:
                - /url: https://github.com/microsoft/playwright/issues/4302?ref=playwrightsolutions.com
              - text: ", if your looking for other alternatives or examples there are a few in the comments."
