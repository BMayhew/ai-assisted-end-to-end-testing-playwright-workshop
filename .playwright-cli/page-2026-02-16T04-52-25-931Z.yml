      - paragraph [ref=e17]: We're two engineers who believe that quality isn't about perfect code - it's about happy users.
    - generic [ref=e21]:
      - heading "Our Philosophy" [level=2] [ref=e22]
      - blockquote [ref=e23]: "\"Quality, at its core, is when your end user is happy.\""
      - generic [ref=e24]:
        - paragraph [ref=e25]: "Think about it: your UI might not be glamorous (is there even such a thing as a perfect UI?). Your code might have a few minor quirks. But if your customer is happy - if they enjoy using your product, if it meets their needs and solves their problems - then you've built a quality product."
        - paragraph [ref=e26]: It's not just about how fast your API responds or what toolset you use for logging. Quality is about user satisfaction.
        - paragraph [ref=e27]: As testers and automation engineers, our goal is to make sure the product meets the expectations of the people who use it. And we love doing that.
        - paragraph [ref=e28]: This philosophy drives everything we do. When we embed with your team, we're not just checking boxes or hitting coverage numbers. We're helping you build confidence that your users will have a great experience.
