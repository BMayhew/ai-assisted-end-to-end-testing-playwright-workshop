            - heading "Final Thoughts" [level=2] [ref=e129]
            - paragraph [ref=e130]:
              - text: The example we had was quite straight forward, you may run into a scenario where you may not have the key but you do have a QR code to use.
              - link "This guide" [ref=e131] [cursor=pointer]:
                - /url: https://cavalloj.medium.com/totp-secret-extraction-from-qr-codes-ee097b4c687f?ref=playwrightsolutions.com
              - text: will walk you through how to extract the key from a QR code utilizing a mobile device.
