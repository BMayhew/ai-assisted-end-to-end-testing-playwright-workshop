            - paragraph [ref=e55]: Have you ever struggled to run specific tests from the command line? I've had the want to run 2-3 tests from the command line together and struggled to autocomplete my way through building the proper command manually.
            - figure "Good News Everybody" [ref=e56]:
              - generic [ref=e57]: Good News Everybody
            - paragraph [ref=e58]: With this new tool I don't have to craft the perfect command line anymore I now have access to a nice command line selector to pick and choose exactly what I want to run!
            - figure [ref=e59]:
              - 'link "GitHub - dennisbergevin/playwright-cli-select: Playwright interactive cli prompts to select and run specs, tests or tags Playwright interactive cli prompts to select and run specs, tests or tags - dennisbergevin/playwright-cli-select GitHub •dennisbergevin" [ref=e60] [cursor=pointer]':
                - /url: https://github.com/dennisbergevin/playwright-cli-select?ref=playwrightsolutions.com
                - generic [ref=e61]:
                  - generic [ref=e62]: "GitHub - dennisbergevin/playwright-cli-select: Playwright interactive cli prompts to select and run specs, tests or tags"
                  - generic [ref=e63]: Playwright interactive cli prompts to select and run specs, tests or tags - dennisbergevin/playwright-cli-select
                  - generic [ref=e64]:
                    - generic [ref=e65]: GitHub
                    - generic [ref=e66]: •dennisbergevin
            - heading "Set it all up" [level=2] [ref=e68]
            - paragraph [ref=e69]:
              - text: To get the cli tool installed it's quite simple! This command installs the dependency and updates your
              - code [ref=e70]: package.json
              - text: file.
            - code [ref=e72]: npm install --save-dev playwright-cli-select
            - paragraph [ref=e73]: Then you can run the cli tool with
            - code [ref=e75]: npx playwright-cli-select run
            - heading "My Experience" [level=2] [ref=e76]
            - paragraph [ref=e77]:
              - text: What I really like about this tool is the flexibility offered! The
              - link "readme" [ref=e78] [cursor=pointer]:
                - /url: https://github.com/dennisbergevin/playwright-cli-select?ref=playwrightsolutions.com
              - text: provides a ton of easy to follow examples on how you can customize your run command. All of this can easily be added to your package.json script in order to have a simple
              - code [ref=e79]: npm run cli
              - text: command, below I've created so the command automatically selects the first
              - code [ref=e80]: specs
              - text: option for me.
            - code [ref=e82]: "// package.json { \"scripts\": { \"cli\": \"npx playwright-cli-select run --specs\", \"test\": \"npx playwright test\" } }"
            - paragraph [ref=e83]:
              - text: Once you've rung the command and you are in the cli interface, you will need to use
              - code [ref=e84]: Tab
              - text: as the "select" key. This was a small learning curve as by default I was just trying to press
              - code [ref=e85]: Enter
              - text: and that actually allows you to "Proceed" Thankfully I read the interface and there were clear instructions on what the buttons do!
            - paragraph [ref=e86]:
              - text: If you ever do get stuck or want to explore the tool without reading the docs on GitHub you also have access to
              - code [ref=e87]: npx playwright-cli-select run --help
              - text: a help flag which providers all the different options at your fingertips!
            - paragraph [ref=e88]: Overall I am a fan, and with very little effort on my end I'll have an easy way to run multiple spec files together via this tool. I plan to add this to all of my past, present, and future playwright projects! Check it out in action below.
